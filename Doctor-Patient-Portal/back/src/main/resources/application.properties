# ============================================================
# Server Configuration
# ============================================================
server.port=8080

# ============================================================
# Database Configuration (MySQL - hospital)
# ============================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/hospital?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=wasim

# ============================================================
# Logging Configuration
# ============================================================
logging.level.org.springframework.web=INFO
logging.level.com.hms=INFO
logging.file.name=logs/app.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# ============================================================
# Swagger / OpenAPI
# ============================================================
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
